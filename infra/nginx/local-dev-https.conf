server {
    listen 80;
    server_name imapplepie20.tplinkdns.com approid.team localhost;

    # HTTP to HTTPS redirect
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name imapplepie20.tplinkdns.com approid.team localhost;

    # SSL certificates
    ssl_certificate /etc/nginx/certs/imapplepie20.tplinkdns.com+3.pem;
    ssl_certificate_key /etc/nginx/certs/imapplepie20.tplinkdns.com+3-key.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Frontend (Vite)
    location / {
        proxy_pass http://host.docker.internal:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API
    location /api/ {
        proxy_pass http://host.docker.internal:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Actuator (health check)
    location /actuator {
        proxy_pass http://host.docker.internal:8081/actuator;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
