spring:
  application:
    name: my-forever-music-api
  profiles:
    default: local
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:my_forever_music}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${API_PORT:8080}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /openapi
  swagger-ui:
    path: /docs
    operations-sorter: method
    tags-sorter: alpha

info:
  app:
    name: my-forever-music-api
    version: ${APP_VERSION:0.1.0-SNAPSHOT}
    description: Spring Boot API scaffold for My Forever Music

app:
  youtube:
    data-api-key: ${YOUTUBE_DATA_API_KEY:}
  ems:
    discovery:
      enabled: ${EMS_DISCOVERY_ENABLED:true}
      user-id: ${EMS_DISCOVERY_USER_ID:}
      refresh-interval-ms: ${EMS_DISCOVERY_REFRESH_INTERVAL_MS:86400000}
      initial-delay-ms: ${EMS_DISCOVERY_INITIAL_DELAY_MS:0}
      per-query-limit: ${EMS_DISCOVERY_PER_QUERY_LIMIT:5}
      display-limit: ${EMS_DISCOVERY_DISPLAY_LIMIT:12}
      platforms: ${EMS_DISCOVERY_PLATFORMS:tidal,spotify}
      seed-queries: ${EMS_DISCOVERY_SEED_QUERIES:tidal:THE_HITS,tidal:POPULAR_MIXES,tidal:POPULAR_PLAYLISTS,tidal:FROM_OUR_EDITORS,spotify:featured-playlists,spotify:category:toplists}
    flo-special:
      enabled: ${EMS_FLO_SPECIAL_ENABLED:true}
      refresh-interval-ms: ${EMS_FLO_SPECIAL_REFRESH_INTERVAL_MS:86400000}
      initial-delay-ms: ${EMS_FLO_SPECIAL_INITIAL_DELAY_MS:120000}
      display-limit: ${EMS_FLO_SPECIAL_DISPLAY_LIMIT:120}
    loose-track-playlists:
      enabled: ${EMS_LOOSE_TRACK_PLAYLISTS_ENABLED:true}
      refresh-interval-ms: ${EMS_LOOSE_TRACK_PLAYLISTS_REFRESH_INTERVAL_MS:86400000}
      initial-delay-ms: ${EMS_LOOSE_TRACK_PLAYLISTS_INITIAL_DELAY_MS:300000}
      track-limit: ${EMS_LOOSE_TRACK_PLAYLISTS_TRACK_LIMIT:5000}
      tracks-per-playlist: ${EMS_LOOSE_TRACK_PLAYLISTS_TRACKS_PER_PLAYLIST:40}
      min-track-count: ${EMS_LOOSE_TRACK_PLAYLISTS_MIN_TRACK_COUNT:40}
    acquisition:
      enabled: ${EMS_ACQUISITION_ENABLED:true}
      user-id: ${EMS_ACQUISITION_USER_ID:${EMS_DISCOVERY_USER_ID:}}
      refresh-interval-ms: ${EMS_ACQUISITION_REFRESH_INTERVAL_MS:86400000}
      initial-delay-ms: ${EMS_ACQUISITION_INITIAL_DELAY_MS:60000}
      max-articles-per-source: ${EMS_ACQUISITION_MAX_ARTICLES_PER_SOURCE:20}
      max-signals-per-run: ${EMS_ACQUISITION_MAX_SIGNALS_PER_RUN:40}
      per-seed-limit: ${EMS_ACQUISITION_PER_SEED_LIMIT:5}
      platforms: ${EMS_ACQUISITION_PLATFORMS:spotify,tidal}
      source-preset: ${EMS_ACQUISITION_SOURCE_PRESET:}
      sources:
        - name: Pitchfork News
          type: rss
          url: https://pitchfork.com/feed/feed-news/rss
          weight: 1.0
        - name: Pitchfork Track Reviews
          type: rss
          url: https://pitchfork.com/feed/feed-track-reviews/rss
          weight: 1.1
        - name: Pitchfork Best New Tracks
          type: rss
          url: https://pitchfork.com/feed/reviews/best/tracks/rss
          weight: 1.4
        - name: Stereogum
          type: rss
          url: https://www.stereogum.com/feed/
          weight: 1.1
        - name: BrooklynVegan
          type: rss
          url: https://www.brooklynvegan.com/feed/
          weight: 1.0
        - name: FACT Magazine
          type: rss
          url: https://www.factmag.com/feed/
          weight: 1.0
        - name: The FADER
          type: rss
          url: https://www.thefader.com/feed.rss
          weight: 1.0
        - name: Billboard Music News
          type: rss
          url: https://www.billboard.com/c/music/music-news/feed/
          weight: 1.0
        - name: Rolling Stone Music News
          type: rss
          url: https://www.rollingstone.com/music/music-news/feed/
          weight: 1.0
        - name: The Line of Best Fit
          type: rss
          url: https://www.thelineofbestfit.com/feed
          weight: 1.0
        - name: SPIN
          type: rss
          url: https://www.spinmagazine.com/feed/
          weight: 0.9
        - name: NME
          type: rss
          url: https://www.nme.com/?alt=rss
          weight: 1.0
      source-presets:
        - id: editorial-expanded
          name: Editorial Expanded
          description: Larger editorial RSS preset for growing the EMS acquisition pool.
          max-articles-per-source: 25
          max-signals-per-run: 120
          per-seed-limit: 10
          sources:
            - name: Pitchfork News
              type: rss
              url: https://pitchfork.com/feed/feed-news/rss
              weight: 1.0
            - name: Pitchfork Track Reviews
              type: rss
              url: https://pitchfork.com/feed/feed-track-reviews/rss
              weight: 1.1
            - name: Pitchfork Best New Tracks
              type: rss
              url: https://pitchfork.com/feed/reviews/best/tracks/rss
              weight: 1.4
            - name: Stereogum
              type: rss
              url: https://www.stereogum.com/feed/
              weight: 1.1
            - name: BrooklynVegan
              type: rss
              url: https://www.brooklynvegan.com/feed/
              weight: 1.0
            - name: FACT Magazine
              type: rss
              url: https://www.factmag.com/feed/
              weight: 1.0
            - name: The FADER
              type: rss
              url: https://www.thefader.com/feed.rss
              weight: 1.0
            - name: Billboard Music News
              type: rss
              url: https://www.billboard.com/c/music/music-news/feed/
              weight: 1.0
            - name: Rolling Stone Music News
              type: rss
              url: https://www.rollingstone.com/music/music-news/feed/
              weight: 1.0
            - name: The Line of Best Fit
              type: rss
              url: https://www.thelineofbestfit.com/feed
              weight: 1.0
            - name: SPIN
              type: rss
              url: https://www.spinmagazine.com/feed/
              weight: 0.9
            - name: NME
              type: rss
              url: https://www.nme.com/?alt=rss
              weight: 1.0
            - name: NPR Music
              type: rss
              url: https://feeds.npr.org/1039/rss.xml
              weight: 1.0
            - name: Bandcamp Daily
              type: rss
              url: https://daily.bandcamp.com/feed
              weight: 1.1
            - name: Consequence Music
              type: rss
              url: https://consequence.net/music/feed/
              weight: 1.0
            - name: Clash Magazine
              type: rss
              url: https://www.clashmusic.com/feed/
              weight: 1.0
            - name: Gorilla vs Bear
              type: rss
              url: https://www.gorillavsbear.net/feed/
              weight: 0.9
            - name: Under the Radar
              type: rss
              url: https://www.undertheradarmag.com/site/feed/
              weight: 0.9
            - name: The Quietus
              type: rss
              url: https://thequietus.com/feed/
              weight: 0.9
            - name: Music Business Worldwide
              type: rss
              url: https://www.musicbusinessworldwide.com/feed/
              weight: 0.8
            - name: Resident Advisor News
              type: rss
              url: https://ra.co/xml/news.xml
              weight: 0.9
            - name: Hypebeast Music
              type: rss
              url: https://hypebeast.com/music/feed
              weight: 0.8
  ai:
    base-url: ${AI_SERVICE_BASE_URL:http://127.0.0.1:8000}
    recommendation-preview-path: ${AI_RECOMMENDATION_PREVIEW_PATH:/v1/recommendations/preview}
    ems-overview-path: ${AI_EMS_OVERVIEW_PATH:/v1/ems/overview}
    ems-acquisition-signals-path: ${AI_EMS_ACQUISITION_SIGNALS_PATH:/v1/ems/acquisition/signals}
    audio-feature-inference-path: ${AI_AUDIO_FEATURE_INFERENCE_PATH:/v1/audio-features/infer}
    sasrec-training-path: ${AI_SASREC_TRAINING_PATH:/v1/recommendations/datasets/sasrec/train}
    sasrec-ranking-path: ${AI_SASREC_RANKING_PATH:/v1/recommendations/datasets/sasrec/rank}
    sasrec-latest-model-path: ${AI_SASREC_LATEST_MODEL_PATH:/v1/recommendations/datasets/sasrec/models/latest}
    sasrec-model-version: ${AI_SASREC_MODEL_VERSION:}
  audio-features:
    reccobeats:
      enabled: ${RECCOBEATS_ENABLED:true}
      base-url: ${RECCOBEATS_API_BASE_URL:https://api.reccobeats.com/v1}
    completion:
      scheduler:
        enabled: ${AUDIO_FEATURES_COMPLETION_SCHEDULER_ENABLED:false}
        fixed-delay-ms: ${AUDIO_FEATURES_COMPLETION_SCHEDULER_FIXED_DELAY_MS:300000}
        initial-delay-ms: ${AUDIO_FEATURES_COMPLETION_SCHEDULER_INITIAL_DELAY_MS:60000}
        batch-limit: ${AUDIO_FEATURES_COMPLETION_SCHEDULER_BATCH_LIMIT:20}
        worker-id: ${AUDIO_FEATURES_COMPLETION_SCHEDULER_WORKER_ID:audio-feature-completion-scheduler}
      lastfm:
        min-confidence: ${AUDIO_FEATURES_COMPLETION_LASTFM_MIN_CONFIDENCE:0.55}
  melon:
    scrape:
      enabled: ${MELON_SCRAPE_ENABLED:false}
      fixed-delay-ms: ${MELON_SCRAPE_FIXED_DELAY_MS:86400000}
      initial-delay-ms: ${MELON_SCRAPE_INITIAL_DELAY_MS:300000}
  recommendation:
    audio-taste:
      min-positive-ready-tracks: ${AUDIO_TASTE_MIN_POSITIVE_READY_TRACKS:10}
      min-feature-ready-ratio: ${AUDIO_TASTE_MIN_FEATURE_READY_RATIO:0.30}
    metadata:
      wikidata:
        user-agent: ${APP_RECOMMENDATION_METADATA_WIKIDATA_USER_AGENT:MyForeverMusic/1.0 ( admin@my-forever-music.local )}
      discogs:
        user-agent: ${APP_RECOMMENDATION_METADATA_DISCOGS_USER_AGENT:MyForeverMusic/1.0}
        token: ${DISCOGS_TOKEN:${APP_RECOMMENDATION_METADATA_DISCOGS_TOKEN:}}
  platform:
    lastfm:
      enabled: ${LASTFM_ENABLED:false}
      api-key: ${LASTFM_API_KEY:}
      shared-secret: ${LASTFM_SHARED_SECRET:}
      api-root: ${LASTFM_API_ROOT:https://ws.audioscrobbler.com/2.0/}
    oauth:
      spotify:
        enabled: ${SPOTIFY_OAUTH_ENABLED:false}
        client-id: ${SPOTIFY_CLIENT_ID:}
        client-secret: ${SPOTIFY_CLIENT_SECRET:}
        redirect-uri: ${SPOTIFY_REDIRECT_URI:http://localhost:5173/platforms/oauth/callback}
        authorization-uri: ${SPOTIFY_AUTHORIZATION_URI:https://accounts.spotify.com/authorize}
        token-uri: ${SPOTIFY_TOKEN_URI:https://accounts.spotify.com/api/token}
        api-base-uri: ${SPOTIFY_API_BASE_URI:https://api.spotify.com/v1}
        scopes: ${SPOTIFY_SCOPES:user-read-email,playlist-read-private,playlist-read-collaborative,streaming,user-read-playback-state,user-modify-playback-state,user-read-currently-playing}
      tidal:
        enabled: ${TIDAL_OAUTH_ENABLED:false}
        client-id: ${TIDAL_CLIENT_ID:}
        client-secret: ${TIDAL_CLIENT_SECRET:}
        redirect-uri: ${TIDAL_REDIRECT_URI:http://localhost:5173/platforms/oauth/callback}
        authorization-uri: ${TIDAL_AUTHORIZATION_URI:https://login.tidal.com/authorize}
        token-uri: ${TIDAL_TOKEN_URI:https://auth.tidal.com/v1/oauth2/token}
        api-base-uri: ${TIDAL_API_BASE_URI:https://openapi.tidal.com/v2}
        legacy-api-base-uri: ${TIDAL_LEGACY_API_BASE_URI:https://api.tidal.com/v1}
        country-code: ${TIDAL_COUNTRY_CODE:US}
        scopes: ${TIDAL_SCOPES:r_usr,w_usr,w_sub,r_stream,playback,entitlements.read}

logging:
  level:
    io.myforevermusic.api: INFO
